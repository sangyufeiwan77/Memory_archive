<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Archive — First Presbyterian Church</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0806;--paper:#1c1710;--paper2:#221e13;--paper3:#2a2416;
  --ink:#d4c9a8;--ink-dim:#7a6e54;
  --gold:#c8a84b;--gold-dim:#6b5a28;--gold-glow:rgba(200,168,75,0.12);
  --spine:#0f0d08;--border:rgba(200,168,75,0.18);
  --tab-w:60px;--trans:0.28s ease;
}
html,body{width:100%;height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:'IM Fell English',serif;}

/* ── BOOK ── */
.book{display:flex;width:min(1240px,99vw);height:min(800px,96vh);
  filter:drop-shadow(0 20px 60px rgba(0,0,0,0.9));}

/* ── TABS ── */
.tabs{width:var(--tab-w);background:var(--spine);
  border-right:1px solid rgba(200,168,75,0.1);
  display:flex;flex-direction:column;align-items:center;
  padding-top:24px;flex-shrink:0;z-index:10;}
.tab{writing-mode:vertical-rl;transform:rotate(180deg);
  background:none;border:none;
  border-bottom:1px solid rgba(200,168,75,0.08);
  color:var(--ink-dim);font-family:'Cinzel',serif;font-size:0.6rem;
  letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;
  padding:16px 8px;width:100%;transition:color var(--trans),background var(--trans);}
.tab:hover,.tab.on{color:var(--gold);background:var(--gold-glow);}

/* ── LEFT PAGE ── */
.page-l{flex:1;background:var(--paper2);border-right:3px solid #060402;
  display:flex;flex-direction:column;overflow:hidden;position:relative;}
.page-l::before{content:'';position:absolute;top:0;left:0;width:28px;height:100%;
  background:linear-gradient(to right,rgba(0,0,0,0.4),transparent);
  pointer-events:none;z-index:3;}
.page-l.expanded{
  position:fixed;inset:0;z-index:250;
  border-right:none;
}
.page-l-inner{flex:1;overflow-y:auto;padding:26px 24px 24px 38px;
  position:relative;z-index:2;}
.page-l.expanded .page-l-inner{
  max-width:760px;margin:0 auto;padding:48px 32px 40px;
}
.panel{display:none;}.panel.on{display:block;}
.fs-toggle{
  position:absolute;top:14px;right:14px;z-index:4;
  background:rgba(0,0,0,0.3);border:1px solid var(--gold-dim);border-radius:2px;
  color:var(--gold);font-family:'Cinzel',serif;font-size:0.85rem;
  width:30px;height:30px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--trans);
}
.fs-toggle:hover{background:var(--gold-glow);border-color:var(--gold);}
.panel-head{font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--gold-dim);margin-bottom:16px;
  padding-bottom:7px;border-bottom:1px solid var(--border);}

/* ── BOOKSHELF ── */
.shelf{background:linear-gradient(to bottom,#110e07,#191208);
  border:1px solid rgba(200,168,75,0.08);border-radius:3px;
  padding:18px 12px 14px;min-height:130px;
  display:flex;align-items:flex-end;gap:5px;
  margin-bottom:14px;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.6);
  position:relative;}
.shelf::after{content:'';position:absolute;bottom:0;left:0;right:0;height:8px;
  background:linear-gradient(to bottom,#241a08,#140e02);
  border-top:1px solid rgba(200,168,75,0.12);border-radius:0 0 3px 3px;}
.bspine{writing-mode:vertical-rl;transform:rotate(180deg);
  height:100px;width:30px;border-radius:2px 3px 3px 2px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:0.48rem;
  letter-spacing:0.05em;text-align:center;line-height:1.3;
  cursor:pointer;flex-shrink:0;box-shadow:1px 0 5px rgba(0,0,0,0.6);
  transition:transform var(--trans),box-shadow var(--trans);padding:3px;}
.bspine:hover{transform:translateY(-10px) rotate(180deg);box-shadow:2px 6px 14px rgba(200,168,75,0.18);}
.bspine.on{transform:translateY(-14px) rotate(180deg);box-shadow:2px 8px 18px rgba(200,168,75,0.28);}
.ch-panel{animation:slideD .2s ease;}
@keyframes slideD{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.ch-panel h4{
  font-family:'Cinzel',serif;font-size:0.72rem;color:var(--gold);
  margin-bottom:4px;padding-bottom:0;border-bottom:none;
}
.book-source{
  font-size:0.6rem;color:var(--ink-dim);font-style:italic;
  margin:0 0 16px;padding-bottom:8px;line-height:1.5;
  border-bottom:1px solid var(--border);
}
.book-reader{padding:0;}
.book-chapter{padding:0 0 24px;}
.book-chapter+.book-chapter{
  padding-top:20px;
  border-top:1px solid rgba(200,168,75,0.08);
}
.ch-era{
  font-family:'Cinzel',serif;font-size:0.5rem;
  letter-spacing:0.16em;color:var(--gold-dim);
  text-transform:uppercase;margin-bottom:6px;
}
.ch-name{
  font-family:'Cinzel',serif;font-size:0.78rem;
  color:var(--ink);margin-bottom:12px;
}
.ch-body{
  font-size:0.76rem;color:var(--ink);
  line-height:1.85;
}
.ch-body p{margin-bottom:14px;}
.ch-body p:last-child{margin-bottom:0;}
.ch-img{
  width:100%;margin:12px 0;
  border:1px solid var(--border);
  border-radius:2px;display:block;
  filter:sepia(0.25) brightness(0.9);
}
.ch-gallery{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px;margin:12px 0;
}
.ch-gallery .ch-img{margin:0;}
.ch-gallery figure{margin:0;}
.ch-gallery figcaption{
  font-size:0.58rem;color:var(--ink-dim);font-style:italic;
  margin-top:3px;text-align:center;
}

/* ── EXHIBITION CABINET ── */
.cabinet-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 8px;
}

/* Outer cabinet shell */
.cabinet-outer{
  width:88%;
  border:1.5px solid rgba(200,168,75,0.45);
  border-radius:4px;
  background:linear-gradient(to bottom,#0e0c07,#181208);
  box-shadow:0 0 0 3px rgba(200,168,75,0.07), inset 0 0 20px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden;
}

/* Glass panel — the display window */
.cabinet-glass{
  margin:12px 10px 0;
  border:1px solid rgba(200,168,75,0.3);
  border-radius:3px;
  background:rgba(200,168,75,0.03);
  height:110px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
}
/* Glass reflection */
.cabinet-glass::after{
  content:'';
  position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(to bottom,rgba(255,255,255,0.04),transparent);
  pointer-events:none;
}
/* Glass side glints */
.cabinet-glass::before{
  content:'';
  position:absolute;top:4px;left:4px;bottom:4px;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.08),transparent);
  pointer-events:none;
}

/* Object inside glass */
.cab-object-wrap{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;padding:8px;
}
.cab-object-wrap svg{max-height:88px;width:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));}

/* Cabinet base / plinth */
.cabinet-base{
  margin:8px 10px 0;
  border-top:1px solid rgba(200,168,75,0.25);
  padding:8px 10px 12px;
}

/* Label tag strip on base */
.cabinet-label-tag{
  display:inline-block;
  border:1px solid;
  border-radius:2px;
  padding:2px 10px;
  font-family:'Cinzel',serif;
  font-size:0.55rem;
  letter-spacing:0.12em;
  margin-bottom:7px;
}
.cab-item-name{
  font-family:'Cinzel',serif;font-size:0.72rem;
  color:var(--ink);margin-bottom:2px;
}
.cab-item-year{
  font-family:'Cinzel',serif;font-size:0.55rem;
  letter-spacing:0.12em;color:var(--gold-dim);margin-bottom:5px;
}
.cab-item-desc{
  font-size:0.66rem;color:var(--ink-dim);
  font-style:italic;line-height:1.5;
}

/* Cabinet legs */
.cabinet-legs{
  display:flex;justify-content:space-between;
  padding:0 16px;margin-top:2px;width:88%;
}
.cab-leg{
  width:8px;height:10px;
  background:linear-gradient(to bottom,rgba(200,168,75,0.3),rgba(200,168,75,0.1));
  border:1px solid rgba(200,168,75,0.2);
  border-top:none;border-radius:0 0 2px 2px;
}

/* Navigation arrows */
.cabinet-nav{
  display:flex;align-items:center;justify-content:center;
  gap:16px;margin-top:12px;width:88%;
}
.cab-arrow{
  background:none;border:1px solid var(--gold-dim);border-radius:2px;
  color:var(--gold);font-size:1rem;padding:3px 12px;
  cursor:pointer;transition:all var(--trans);font-family:'Cinzel',serif;
}
.cab-arrow:hover{background:var(--gold-glow);border-color:var(--gold);}
.cab-dots{display:flex;gap:5px;align-items:center;}
.cab-dot{width:4px;height:4px;border-radius:50%;
  background:var(--gold-dim);transition:background var(--trans);}
.cab-dot.on{background:var(--gold);}

/* ── MEDIA ── */
.med-item{background:var(--paper3);border:1px solid var(--border);border-radius:3px;
  padding:13px;margin-bottom:9px;display:flex;gap:12px;align-items:center;}
.med-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-dim);font-size:0.9rem;flex-shrink:0;}
.med-title{font-family:'Cinzel',serif;font-size:0.65rem;color:var(--ink);margin-bottom:3px;}
.med-desc{font-size:0.68rem;color:var(--ink-dim);font-style:italic;}

/* ── RIGHT PAGE ── */
.page-r{flex:1.15;background:var(--paper);display:flex;flex-direction:column;
  overflow:hidden;position:relative;}
.page-r::before{content:'';position:absolute;top:0;left:0;width:18px;height:100%;
  background:linear-gradient(to right,rgba(0,0,0,0.28),transparent);
  pointer-events:none;z-index:3;}
.page-r-inner{flex:1;display:flex;flex-direction:column;
  padding:22px 28px;position:relative;z-index:2;}
.r-title{font-family:'Cinzel Decorative',serif;font-size:0.58rem;letter-spacing:0.28em;
  color:var(--gold-dim);text-align:center;margin-bottom:4px;}
.r-sub{font-size:0.65rem;color:var(--ink-dim);font-style:italic;
  text-align:center;margin-bottom:18px;}

/* ── WINDOW GRID 2×3 ── */
.win-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:14px 18px;
  flex:1;min-height:0;
}

.win-cell{display:flex;flex-direction:column;min-height:0;}

/* ARCH — top portion, just the semicircle header */
.arch-wrap{position:relative;flex-shrink:0;}
.arch-svg{width:100%;display:block;}
.arch-year-wrap{
  position:absolute;top:0;left:0;right:0;
  height:100%;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.arch-year-wrap.interactive{pointer-events:all;}
.year-display{
  display:flex;flex-direction:column;
  align-items:center;gap:3px;
  width:88%;
  user-select:none;
}
.yr-num{
  font-family:'Cinzel',serif;
  font-size:clamp(0.65rem,1.2vw,0.9rem);
  letter-spacing:0.06em;
  text-align:center;
  line-height:1;
}
/* Slider */
.yr-slider{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:3px;
  border-radius:2px;
  background:rgba(200,168,75,0.2);
  outline:none;
  cursor:pointer;
}
.yr-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--c, var(--gold));
  cursor:pointer;
  border:none;
  box-shadow:0 0 5px var(--c, rgba(200,168,75,0.5));
}
.yr-slider::-moz-range-thumb{
  width:12px;height:12px;
  border-radius:50%;
  background:var(--c, var(--gold));
  cursor:pointer;border:none;
}
.year-display.locked .yr-slider{display:none;}

/* THUMBNAIL — tall rect that fills the rest of the cell */
.thumb-panel{
  flex:1;min-height:0;
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 4px 4px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:border-color var(--trans),box-shadow var(--trans);
}
.thumb-panel:hover{box-shadow:0 0 12px rgba(200,168,75,0.15);}
.thumb-placeholder{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:5px;padding:8px;
}
.thumb-icon{font-size:1rem;opacity:0.2;}
.thumb-title{
  font-family:'Cinzel',serif;
  font-size:clamp(0.42rem,0.8vw,0.58rem);
  color:var(--ink-dim);text-align:center;line-height:1.4;
}
/* Thumbnail with real image */
.thumb-img-wrap{
  width:100%;height:100%;
  position:relative;overflow:hidden;
}
.thumb-img-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:sepia(0.3) brightness(0.85);
  transition:filter var(--trans),transform var(--trans);
}
.thumb-panel:hover .thumb-img-wrap img{
  filter:sepia(0.1) brightness(1);
  transform:scale(1.04);
}
.thumb-img-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:5px 6px 4px;
  background:linear-gradient(to top,rgba(0,0,0,0.75),transparent);
  font-family:'Cinzel',serif;
  font-size:clamp(0.38rem,0.7vw,0.52rem);
  color:var(--ink);text-align:center;line-height:1.4;
  pointer-events:none;
}

/* Footer era label */
.win-foot{
  flex-shrink:0;
  font-family:'Cinzel',serif;font-size:0.44rem;
  letter-spacing:0.07em;color:var(--ink-dim);
  text-align:center;margin-top:4px;text-transform:uppercase;
}

/* ── MEMORY FULLSCREEN ── */
.mem-overlay{
  position:fixed;inset:0;
  background:#000;
  z-index:300;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.32s;
}
.mem-overlay.open{opacity:1;pointer-events:all;}

/* Full-screen image */
.mem-fullimg{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.mem-fullimg img{
  width:100%;height:100%;object-fit:contain;display:block;
}
.mem-fullimg-ph{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;color:rgba(255,255,255,0.2);
  font-style:italic;font-size:0.9rem;
}

/* Close button — top left */
.mem-close{
  position:absolute;top:20px;left:20px;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:3px;
  color:rgba(255,255,255,0.7);
  font-family:'Cinzel',serif;
  font-size:0.75rem;letter-spacing:0.1em;
  padding:7px 14px;cursor:pointer;
  z-index:10;
  transition:all var(--trans);
  display:flex;align-items:center;gap:6px;
}
.mem-close:hover{background:rgba(0,0,0,0.8);color:#fff;border-color:rgba(255,255,255,0.5);}

/* Full-screen video (YouTube embed) */
.vid-frame-wrap{
  position:relative;width:min(92vw,1100px);aspect-ratio:16/9;
  background:#000;box-shadow:0 0 60px rgba(0,0,0,0.6);
}
.vid-frame-wrap iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--paper3);border:1px solid var(--border);border-radius:3px;
  padding:8px 18px;font-style:italic;font-size:0.78rem;color:var(--ink);
  z-index:500;opacity:0;pointer-events:none;transition:opacity .3s;}
.toast.show{opacity:1;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--paper);}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px;}
</style>
</head>
<body>

<div class="book">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab on" onclick="switchTab('books',this)">Books</button>
    <button class="tab"    onclick="switchTab('exhibitions',this)">Exhibition</button>
    <button class="tab"    onclick="switchTab('media',this)">Media</button>
  </div>

  <!-- LEFT PAGE -->
  <div class="page-l" id="page-l">
    <button class="fs-toggle" id="fs-toggle" onclick="toggleFullscreen()" title="Expand to fullscreen">⛶</button>
    <div class="page-l-inner">

      <!-- BOOKS -->
      <div class="panel on" id="p-books">
        <div class="panel-head">The Archive — Books</div>
        <div class="shelf" id="shelf"></div>
        <div id="ch-area"></div>
      </div>

      <!-- EXHIBITIONS -->
      <div class="panel" id="p-exhibitions">
        <div class="panel-head">The Archive — Exhibitions</div>

        <!-- Glass display cabinet -->
        <div class="cabinet-wrap">
          <div class="cabinet-outer">
            <!-- Glass window -->
            <div class="cabinet-glass">
              <div class="cab-object-wrap" id="cab-object"></div>
            </div>
            <!-- Base with label -->
            <div class="cabinet-base">
              <div class="cabinet-label-tag" id="cab-tag">—</div>
              <div class="cab-item-name"  id="cab-name"></div>
              <div class="cab-item-year"  id="cab-year"></div>
              <div class="cab-item-desc"  id="cab-desc"></div>
            </div>
          </div>
          <!-- Legs -->
          <div class="cabinet-legs">
            <div class="cab-leg"></div><div class="cab-leg"></div>
            <div class="cab-leg"></div><div class="cab-leg"></div>
          </div>
          <!-- Nav -->
          <div class="cabinet-nav">
            <button class="cab-arrow" onclick="cabNav(-1)">‹</button>
            <div class="cab-dots" id="cab-dots"></div>
            <button class="cab-arrow" onclick="cabNav(1)">›</button>
          </div>
        </div>
      </div>

      <!-- MEDIA -->
      <div class="panel" id="p-media">
        <div class="panel-head">The Archive — Media</div>
        <div id="med-list"></div>
      </div>

    </div>
  </div>

  <!-- RIGHT PAGE -->
  <div class="page-r">
    <div class="page-r-inner">
      <div class="r-title">Memory Archive</div>
      <div class="r-sub">First Presbyterian Church · South Chicago · Est. 1833</div>
      <div class="win-grid" id="win-grid"></div>
    </div>
  </div>

</div>

<!-- MEMORY FULLSCREEN OVERLAY -->
<div class="mem-overlay" id="mem-overlay" onclick="bgClose(event)">
  <div class="mem-fullimg" id="mem-fullimg">
    <div class="mem-fullimg-ph" id="mem-fullimg-ph">
      <span style="font-size:3rem;opacity:0.15">✦</span>
      <span>Illustration — drop image here</span>
    </div>
  </div>
  <button class="mem-close" onclick="closeMem()">✕ &nbsp;Close</button>
</div>

<!-- VIDEO FULLSCREEN OVERLAY -->
<div class="mem-overlay" id="vid-overlay" onclick="bgCloseVideo(event)">
  <div class="vid-frame-wrap" id="vid-frame-wrap"></div>
  <button class="mem-close" onclick="closeVideo()">✕ &nbsp;Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════ DATA ═══════════════════════════

const WINDOWS = [
  { id:'w1', correctYear:1833, color:'#b8860b',

    illustBg:'linear-gradient(135deg,#120e06,#221806)',
    imgSrc: 'images/1833_fort_dearborn.jpg.png'
  },
  { id:'w2', correctYear:1833, color:'#a0780a',

    illustBg:'linear-gradient(135deg,#100c05,#1e1606)',
    imgSrc: 'images/1833_infants_school.jpg'
  },
  { id:'w3', correctYear:1857, color:'#2e8b9a',

    illustBg:'linear-gradient(135deg,#06121a,#0c1e28)',
    imgSrc: ''
  },
  { id:'w4', correctYear:1871, color:'#9a4a1a',

    illustBg:'linear-gradient(135deg,#180804,#2a1008)',
    imgSrc: 'images/1871_fire.jpg'
  },
  { id:'w5', correctYear:1893, color:'#7b3fa0',

    illustBg:'linear-gradient(135deg,#0d0814,#1a1028)',
    imgSrc: 'images/1893_parliament.png'
  },
  { id:'w6', correctYear:1965, color:'#9a2e2e',

    illustBg:'linear-gradient(135deg,#100408,#200810)',
    imgSrc: 'images/1965_bsr.jpg'

  },
];

const EXHIBITIONS = [
  { era:'1833', color:'#b8860b', name:'Founding Documents',
    year:'June 26, 1833',

       img:'images/renewal/fort_dearborn_carpentry_shop.png',
       preview:`<p>First Presbyterian, Chicago's first chartered church, was built on the ashes of the Blackhawk uprising, rose from the ruin of the Great Chicago Fire, and today stands tall as a beacon to its community.</p>
<p>The First Presbyterian Church of Chicago laid its foundation on June 26, 1833, in the carpentry shop of the second Fort Dearborn on the south bank of the Chicago River. There, the Rev. Jeremiah Porter, a young Congregationalist from Philadelphia, led 26 parishioners banded together as standard-bearers of faith in the rough-hewn young village. Only the garrison and a few hastily assembled log cabins separated the town from the wilderness, and prairie wolves wandered where no streets had yet been laid.</p>
<p>"You perceive we have many things to encourage us to go forward in the good work of the Lord: We have also many to render sick the heart," Porter wrote to a friend. "The Sabbath by multitudes is most shamefully abused; twenty stores and groceries are dealing out liquid death, while there but two real temperance stores in the place and those kept by members of my church. In addition to these evils profaneness prevails to an extent such as I never witnessed before. The teams from the Wabash that visit us daily, seem to come loaded with cursing and bitterness. The drivers appear almost as degraded as the miserable heathen around us. But profaneness does not stop with them. Many who call themselves gentlemen and move in the highest arch of society are embellishing, or polluting, almost every sentence they utter with some oath or curse. My soul is sick hearing them as they pass the streets."</p>
<p style="font-size:0.85em;opacity:0.7"><em>"The church held its first worship services in the carpentry shop of the second Fort Dearborn, on the banks of the Chicago River. Members included soldiers from the garrison and early settlers of the emerging community."</em> — <em>Renewal of a Symbol</em>, p. 1</p>`},
      {id:'bc14',title:'Seven Locations, One Name',era:'1833–1928',
       img:'images/FPC_locations.png',
       preview:`<p>The First Presbyterian Church has had seven different locations, but always the same name. The church was founded on June 26, 1833 in Fort Dearborn ①. It dedicated its first small frame church on Clark and Lake ② in January 1834. This building was moved in 1837 to Clark and Washington ③ and doubled in length. In 1840 ④ it doubled in width. A new "Brick Church" ⑤ was built at the same location and dedicated in 1849. It was sold in 1857, and the proceeds were used to help start three new Presbyterian churches, including the new "Marble Church" ⑥ dedicated in 1857.</p>
<p>Located on Wabash and Congress, it was destroyed by the Chicago Fire in 1871. Early in 1872 the congregation united with Calvary Presbyterian, which had just begun construction of a new building on Indiana Avenue and 21st Street. ⑦ The structure was dedicated in 1873. The church merged with 41st Street Presbyterian ⑧ on 41st and Grand Boulevard in 1913. Finally, in 1926, First Presbyterian merged with Woodlawn Presbyterian. The present building ⑨ was dedicated in 1928.</p>

  { id:'b4', title:'The History of Our Church', year:'1985',
    bg:'#2a1810', fg:'#c07840',
    source:'Source: First Presbyterian Church of Chicago, "The History of Our Church," <a href="https://www.chicagofirstchurch.org/history" target="_blank" rel="noopener">chicagofirstchurch.org/history</a>.',
    chapters:[
      {id:'bc7',title:'The Frontier Church',era:'1833–1860',
       imgs:[
         {src:'images/history/potawatomi_nation.webp',caption:'Potawatomi Nation was the First Peoples Nation in Chicago at the time First Church was founded'},

         {src:'images/history/eliza_chappell_porter.webp',caption:'Eliza Emily Chappell Porter'},
         {src:'images/history/eliza_infants_school.jpg',caption:'Eliza Chappel\'s Infant\'s School, 1833 (photographed 1934) — courtesy of the Plainfield Historical Society, via <a href="http://www.idaillinois.org/digital/collection/ppld01/id/294/" target="_blank" rel="noopener">Illinois Digital Archives</a>'},
       ],
       preview:`<p>The First Presbyterian Church was organized in June of 1833, two months before Chicago was incorporated. We were the first church in Chicago, and we remain the oldest continuously operating institution in this city.</p>
<p>The church's first building was shared with the carpentry shop in Fort Dearborn. 25 Congregationalists and one Presbyterian were in the original congregation. That Presbyterian (Philo Carpenter – also Chicago's first pharmacist) convinced the assembly to adopt his denomination's affiliation and polity.</p>
<p>The church's founding pastor, Jeremiah Porter, was a staunch abolitionist. First Church organized the first abolitionist society in Illinois, and Porter had a reputation for preaching against the evils of slavery. First was also known for its role in the local temperance movement. Its anti-alcohol meetings attracted people from all over the territory. Once, a member of the Blackhawk tribe came to a meeting at First. After listening to a speech about temperance, he surprised everyone by pulling a bottle of whiskey out of his pocket, placing it on the table, and smashing it with his tomahawk.</p>
<p>First Church was the site of the first regional public school, founded by Eliza Emily Chappel, who later married Rev. Jeremiah. In addition to being the first public school teacher in Chicago, Chappel educated settlers in natives in joint classes, aided the wounded in the Civil War, participated in the Underground Railroad, and taught freedmen.</p>
<p>In October, 1845, the elders of First Church rocked the Presbytery of Ottowa with a resolution denouncing slavery as a "heinous sin against God," and urging the Presbytery to be prepared to withdraw from the denomination if they refused to make a clear stand against slavery. A segment of First's congregation was very upset by this move, urging that "such matters were not in the church's province," and split to form the Second Presbyterian Church of Chicago.</p>
<p>In the 1850s, the elder Philo Carpenter organized an "underground railroad station" which aided more than 200 runaway enslaved people. When the Fugitive Slave Law forbade aid and comfort to runaway slaves, the Session of First Church publicly resolved to disobey the law.</p>
<p>Abolition continued to be First's primary concern until the Civil War, but it was not their only concern. Eliza Chappell's legacy could be clearly seen in their mission to education as well. In 1957, First Church founded The Railroad Chapel, a school with classrooms in converted train cars. In its first year, there were 15 students including "American, Irish, German, and colored boys." It is likely that this was the first integrated school in the area. By the end of the year, 200 more students had enrolled in the school.</p>`},
      {id:'bc8',title:'Persistence Through Crisis',era:'1861–1899',
       imgs:[
         {src:'images/history/church_after_fire.webp',caption:'First Church after the Great Chicago Fire'},
         {src:'images/history/marble_church_wabash.webp',caption:'First Church occupied Marble Church on Wabash until the Great Chicago Fire'},
         {src:'images/history/parliament_delegates_1893.webp',caption:'Delegates at the Parliament of World Religions, 1893'},
       ],
       preview:`<p>Zepheniah Moore Humphrey, First Church's fourth pastor, guided the church through the crisis of the Civil War. During his pastorate, Moore's second cousin John Brown led his famous rebellion at Harper's Ferry. Moore was just as radical as his cousin, though his tactics were described as more "gentle and refined." He focused on the spiritual dimension of the national division.</p>
<p>Humphrey was succeeded by Arthur Mitchell, who pastored the church through the Great Chicago Fire of 1871. The fire destroyed the church and the Railroad Chapel, as well as the homes and businesses of many members. The congregation built its fifth church on 21st Street, continuing its trend of moving further into the south of the city.</p>
<p>Following the Great Fire, Chicago went on an economic binge that climaxed in 1893 with the World's Fair. First's sixth Pastor, John Henry Barrows, organized the first Parliament of the World's Religions. This was a conference to foster dialogue among leaders of the world's faiths. Delegates included prominent Jainists, Buddhists, Muslims, Hindus, Bahá'í, and Spiritualists. The Parliaments continue to this day and are a model for progressive interfaith dialogue. There is some irony that Barrows has this legacy of fostering pluralism, as he was an avowed Christian supremacist and intended the Parliament to prove that Christianity was "the best religion," because it contains "all that is true in all the faiths."</p>
<p>As pastor, Barrows focused First Church's mission on outreach to immigrants and foreigners living in Chicago. So many Chinese immigrants joined First Church in 1894 that the church had to hire an interpreter to translate the service for them.</p>`},
      {id:'bc9',title:'First Church in Woodlawn',era:'1926–1955',
       imgs:[
         {src:'images/history/harold_bowman.webp',caption:'Harold Leonard Bowman'},
         {src:'images/history/hansberry_decision_headline.jpg',caption:'The Hansberry Decision was one factor that changed the racial makeup of Woodlawn in the 1940s and 50s'},
         {src:'images/history/young_members_rehearsing.webp',caption:'Young members of First Church rehearsing in the mid-1950s'},
       ],
       preview:`<p>In the first third of the 20th century, First Church was preoccupied with a number of mergers with other churches that continued the church's gradual move southward. In 1926, First merged with Woodlawn Park Presbyterian Church, and a new American Gothic cathedral was built at 64th and Kimbark Avenue, in the heart of Woodlawn. This is still the building where First Church meets nearly a century later. In its heyday, First Church was a preeminent society church for Chicago with its own publishing operation and a membership that exceeded 2,200.</p>
<p>However, First Church's move to Woodlawn had complicated intentions. Though the church had retained a significant Asian-American membership, it resolutely would not admit Black members. The move to Woodlawn (at that time a white community) was probably part of the larger trend of white flight from the urban centers where demographics were rapidly shifting. The church's benevolence extended to European refugees escaping political oppression, but many members balked at the Black refugees escaping Jim Crow who were arriving in the early waves of the Great Migration.</p>
<p>After World War II, federal housing policies encouraged property owners in South Side to divide apartments into smaller units to accommodate war-time population pressures. This drove down housing costs and allowed families with lower incomes to move into the area. First Church's pastor, Harold Leonard Bowman, sensed the imminence of a racial change in Woodlawn and began preaching and teaching to prepare the congregation for integration.</p>
<p>In spite of the church's record of radicalism on issues of racial justice, there was significant resistance to integration. Some elders on Session felt that the acceptance of "colored members" should be delayed "six months or longer, pending further education of the congregation." Bowman strongly rejected this half-measure. A faction of members openly called the church to flee the "destructive influences of the community" and move further south into the suburbs.</p>
<p>Despite these currents of covert and explicit racism in the church, Session voted in 1953 that the church should remain in Woodlawn and invest in the future of the community and the people who were moving there. That year, the first Black member was receive into First Church, and by 1956 the congregation had a significant Black membership. The church faced consequences for its decision – by 1957, half of the congregation had left, taking much of the church's resources with them.</p>`},
      {id:'bc10',title:'The Return to Radicalism',era:'1956–1964',
       imgs:[
         {src:'images/history/woodlawn_revolt_headline.jpg',caption:'Woodlawn: A Community in Revolt'},
         {src:'images/history/bowman_blakely_leber.webp',caption:'Bowman, Blakely, and Leber'},
         {src:'images/history/dilapidated_woodlawn_housing.jpg',caption:'Dilapidated Woodlawn housing in the 1960s'},
       ],
       preview:`<p>In 1956, three years after accepting its first Black member, First Church called an interracial team of co-pastors, Ulysses B. Blakely and Charles T. Leber, known to the community as "Buck and Chuck."</p>
<p>Community morale was low. Investors had abandoned the neighborhood, and many believed it was inevitable that Woodlawn would be bulldozed to make way for the expansion of the University of Chicago. Blakely and Leber collaborated with other local clergy to organize the community for action. They invited Saul Alinsky and his Industrial Areas Foundation into the community. With generous grants from the Presbytery of Chicago and a Roman Catholic foundation, Alinsky launched the Temporary Woodlawn Organization in 1960.</p>
<p>Alinsky frequently led community meetings at First Church, which made the church a target of bitter controversy. Many members left in protest, stating that such an "overtly political" move was outside the church's proper sphere of activity. The University of Chicago's publication Maroon blared, "Church Supports Hate Group!" and the Christian Century magazine branded the project as a Catholic conspiracy to maintain a segregated neighborhood. Blakely and Leber remained committed to their approach in the face of this opposition. The Woodlawn Organization still exists today, and it has been an important base for organizing and mobilizing the power of Woodlawn residents.</p>
<p>First Church remained on the front lines of community action after Blakely and Leber left. Harold Walker, an interim pastor, wrote: "As in the past, First Church had again found her place in the midst of the struggle for human dignity and at the heart of the city's life."</p>`},
      {id:'bc11',title:'First Church on the Front Lines',era:'1965–1972',
       imgs:[
         {src:'images/history/opportunity_please_knock_chorus.jpg',caption:'Opportunity Please Knock Chorus'},
         {src:'images/history/black_youngsters.webp',caption:'Black youngsters'},
         {src:'images/history/ebony_magazine.webp',caption:'Ebony magazine'},
         {src:'images/history/opportunity_please_knock.jpg',caption:'Opportunity, Please Knock'},
         {src:'images/history/s-l300.webp',caption:'Opportunity, Please Knock — original cast recording'},
       ],
       preview:`<p>First Church's mission in the following years was defined by striving "to be a witness for human brotherhood against racism and violence; to be an advocate of self-determination for all oppressed people, and to expose and resist repression." In 1965, this mission led to engagement with the major youth gang in Woodlawn, called the Black P Stone Nation. The SCLC (the civil rights group founded by Martin Luther King Jr.) had assigned staff to work with the Rangers and attempt to involve them in the Civil Rights movement.</p>
<p>First Church's new pastor, John Fry, shared this view. He and the church saw the Rangers as an indigenous, well-organized source of Black power for the South Side of Chicago. They observed that the Rangers' violent tactics were increasing in proportion to the repressive tactics of the police. As a result, the church decided to devote resources to buffer the organization and urge its leaders to fulfill their responsibility to the community at large.</p>
<p>The program was controversial but had numerous positive effects. The Rangers surrendered more than 100 weapons to the church in the presence of police and Treasury Department agents, which were placed in the church's walk-in safe. The Rangers met in the church's third-floor gym and the church secured federal War on Poverty funds to pay Rangers for organizing the community.</p>
<p>The Rangers apparently took their call to build and protect their community very seriously. They maintained truces with their rivals, the Disciples. When Martin Luther King was murdered and riots sparked all around Chicago, the Rangers patrolled Woodlawn and kept violence at bay. They have also been credited with keeping drugs and sex trafficking out of Woodlawn.</p>
<p>The partnership between First Church and the Rangers also had a creative side. In 1967, the Rangers collaborated with Oscar Brown Jr. on a groundbreaking Northern Soul musical called Opportunity, Please Knock. Eight thousand people came to First Church to see the production in its opening, and it garnered outstanding reviews in many national publications.</p>
<p>However, Fry was also gaining a reputation for speaking out against the tactics of local police, and this led to escalating tensions. The police raided First Church, harassed the Rangers and church staff meeting there, destroyed furniture, and "discovered" the cache of weapons they had helped to establish. The raid made national news, and led to a Senate Investigation, at which Fry testified. The church was accused of harboring guns and ammunition, approving the use and distribution of narcotics, and hosting orgies. Fry was even accused of passing on a murder command. These allegations were investigated thoroughly by the Presbytery of Chicago, and Fry and the church were completely vindicated in a 2,500-page report. But the troubles continued. In 1967, a saboteur deliberately flooded the church. A year later, during the Democratic Convention in Chicago, there was a serious fire in church.</p>
<p>Though these events had the highest visibility, First Church also used other tactics to combat local poverty during this time. The Community Education Program gave Woodlawn residents a preschool program which the community could design and steer. A Headstart program (the first in Chicago) served 120 children. A daycare center provided important support for struggling families in the neighborhood. A highly popular Sisterhood Program fostered a loving network of women who supported and mentored one another.</p>`},
      {id:'bc12',title:"The Church's New Roots",era:'1972–1985',
       preview:`<p>Because of First Church's reputation as a radical church, it had a hard time finding a pastor to replace John Fry. Several years passed in which the church was ably led by its well-organized congregation, in partnership with a few supply pastors. In 1974, a church member, worker, and seminary student, wrote that the absence of a full-time pastor was a "blessing in disguise" for First Church. The empowered congregation embraced their ownership of the church's mission.</p>
<p>Arthur Smith became First Church's pastor in 1976. The landscape of Woodlawn had changed dramatically in the decade before his arrival. In a three-year period, 362 buildings in Woodlawn were reportedly destroyed by arson. The crack epidemic had a crippling effect on the neighborhood, and residents with means fled to the suburbs. This left Woodlawn with large patches of empty lots which the city was auctioning off for cheap.</p>
<p>First Church decided to buy up some of these lots and return them to community use. Three lots on the site of a burned-down Episcopal church were bought and turned into a thriving community garden (now the 65th and Woodlawn Garden). In 1978, First Church began working with the Center for Neighborhood Technology on plans for a solar greenhouse, which was built in 1981. These projects fostered greater resilience in the community's food system and provided abundant sources of fresh produce.</p>`},

// Shuffle helper
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ═══════════════════════════ BOOKS ═══════════════════════════
function renderShelf(){
  const s=document.getElementById('shelf'); s.innerHTML='';
  BOOKS.forEach(b=>{
    const sp=document.createElement('div');
    sp.className='bspine'+(openBook===b.id?' on':'');
    sp.style.background=`linear-gradient(to right,${b.bg}cc,${b.bg}ff,${b.bg}cc)`;
    sp.style.color=b.fg;
    sp.innerHTML=`<span>${b.title}<br><small style="opacity:.55;font-size:.42rem">${b.year}</small></span>`;
    sp.onclick=()=>toggleBook(b.id);
    s.appendChild(sp);
  });
}
function toggleBook(id){
  const area=document.getElementById('ch-area');
  if(openBook===id){area.innerHTML='';openBook=null;renderShelf();return;}
  openBook=id; renderShelf();
  const book=BOOKS.find(b=>b.id===id);
  const panel=document.createElement('div'); panel.className='ch-panel';
  panel.innerHTML=`<h4>${book.title} <span style="color:var(--ink-dim);font-size:.78em">(${book.year})</span></h4>${book.source?`<div class="book-source">${book.source}</div>`:''}`;
  const reader=document.createElement('div'); reader.className='book-reader';
  book.chapters.forEach(ch=>{
    const sec=document.createElement('div'); sec.className='book-chapter';
    let mediaHtml='';
    if(ch.imgs && ch.imgs.length){
      mediaHtml=`<div class="ch-gallery">${ch.imgs.map(im=>
        `<figure><img class="ch-img" src="${im.src}" alt="${im.caption||''}">${im.caption?`<figcaption>${im.caption}</figcaption>`:''}</figure>`
      ).join('')}</div>`;
    } else if(ch.img){
      mediaHtml=`<img class="ch-img" src="${ch.img}" alt="">`;
    }
    sec.innerHTML=`<div class="ch-era">${ch.era}</div>
      <div class="ch-name">${ch.title}</div>
      ${mediaHtml}
      <div class="ch-body">${ch.preview}</div>`;
    reader.appendChild(sec);
  });
  panel.appendChild(reader);
  area.innerHTML='';area.appendChild(panel);
}

      <path d="M40 72 C20 72 10 58 14 44 C16 36 22 30 22 22 C28 32 26 40 32 38 C28 28 34 16 40 8 C42 20 48 26 46 36 C52 30 50 20 54 14 C60 24 66 36 62 50 C58 64 50 72 40 72Z"
        fill="${cg}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M40 66 C28 66 24 56 26 48 C30 40 36 38 36 32 C40 40 38 48 42 46 C40 38 44 30 48 24 C52 34 54 46 48 56 C46 62 43 66 40 66Z"
        fill="${cl}" stroke="${c}" stroke-width="1" stroke-linejoin="round"/>
    </svg>`,
    dome:`<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 50 Q8 14 40 10 Q72 14 72 50 Z" fill="${cg}" stroke="${c}" stroke-width="1.5"/>
      <rect x="4" y="50" width="72" height="8" rx="0" fill="${cl}" stroke="${c}" stroke-width="1"/>
      <rect x="14" y="58" width="52" height="14" fill="${cg}" stroke="${c}" stroke-width="1"/>
      <line x1="40" y1="10" x2="40" y2="50" stroke="${c}" stroke-width="1" stroke-opacity=".4"/>
      <line x1="20" y1="15" x2="20" y2="50" stroke="${c}" stroke-width="1" stroke-opacity=".3"/>
      <line x1="60" y1="15" x2="60" y2="50" stroke="${c}" stroke-width="1" stroke-opacity=".3"/>
      <circle cx="40" cy="10" r="3" fill="${c}" fill-opacity=".7"/>
    </svg>`,
    music:`<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="22" cy="62" rx="12" ry="8" fill="${cl}" stroke="${c}" stroke-width="1.5"/>
      <ellipse cx="58" cy="56" rx="12" ry="8" fill="${cl}" stroke="${c}" stroke-width="1.5"/>
      <line x1="34" y1="62" x2="34" y2="18" stroke="${c}" stroke-width="2"/>
      <line x1="70" y1="56" x2="70" y2="12" stroke="${c}" stroke-width="2"/>
      <line x1="34" y1="18" x2="70" y2="12" stroke="${c}" stroke-width="1.5"/>
      <line x1="34" y1="28" x2="70" y2="22" stroke="${c}" stroke-width="1" stroke-opacity=".5"/>
      <line x1="34" y1="38" x2="70" y2="32" stroke="${c}" stroke-width="1" stroke-opacity=".5"/>
    </svg>`,
  };
  return shapes[type]||shapes.scroll;
}

function renderCabinet(idx){
  cabIdx=((idx%EXHIBITIONS.length)+EXHIBITIONS.length)%EXHIBITIONS.length;
  const ex=EXHIBITIONS[cabIdx];
  // Label tag
  const tag=document.getElementById('cab-tag');
  tag.textContent=ex.era;
  tag.style.borderColor=ex.color;
  tag.style.color=ex.color;
  // Object in glass
  document.getElementById('cab-object').innerHTML=makeShape(ex.shape,ex.color);
  // Base info
  const nm=document.getElementById('cab-name');
  nm.textContent=ex.name; nm.style.color=ex.color;
  document.getElementById('cab-year').textContent=ex.year;
  document.getElementById('cab-desc').textContent=ex.desc;
  // Dots
  const dots=document.getElementById('cab-dots'); dots.innerHTML='';
  EXHIBITIONS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='cab-dot'+(i===cabIdx?' on':'');
    if(i===cabIdx) d.style.background=ex.color;
    dots.appendChild(d);
  });
}
function cabNav(dir){ renderCabinet(cabIdx+dir); }

// ═══════════════════════════ MEDIA ═══════════════════════════
function renderMedia(){
  const list=document.getElementById('med-list');
  MEDIA.forEach(m=>{
    const item=document.createElement('div'); item.className='med-item';
    if(m.yt){
      item.style.cursor='pointer';
      item.onclick=()=>openVideo(m.yt);
    }
    item.innerHTML=`<div class="med-icon">▶</div><div><div class="med-title">${m.title}</div><div class="med-desc">${m.desc}</div></div>`;
    list.appendChild(item);
  });
}

// ═══════════════════════════ WINDOWS ═════════════════════════
function renderWindows(){
  const grid=document.getElementById('win-grid'); grid.innerHTML='';
  WS.forEach((w,i)=>grid.appendChild(makeWinCell(w,i)));
}

function makeWinCell(w,idx){
  const cell=document.createElement('div'); cell.className='win-cell';

  // ── Arch SVG (only the semicircle header part) ──
  const archWrap=document.createElement('div'); archWrap.className='arch-wrap';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 120 56');
  svg.classList.add('arch-svg');

  // Arch shape: comes straight down on sides, arch on top
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M4 56 L4 30 Q4 4 60 4 Q116 4 116 30 L116 56 Z');
  path.setAttribute('fill', w.locked ? w.color+'28' : w.color+'14');
  path.setAttribute('stroke', w.color);
  path.setAttribute('stroke-width','1.8');
  path.setAttribute('stroke-opacity', w.locked ? '1' : '0.5');
  svg.appendChild(path);

  // Decorative lead lines
  const mkL=(x1,y1,x2,y2)=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',w.color);l.setAttribute('stroke-width','1');
    l.setAttribute('stroke-opacity','0.25');svg.appendChild(l);
  };
  mkL(4,36,116,36); mkL(60,4,60,56);

  // ✓ when locked
  if(w.locked){
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x','104');t.setAttribute('y','15');
    t.setAttribute('font-size','9');t.setAttribute('fill',w.color);
    t.setAttribute('fill-opacity','0.9');t.textContent='✓';
    svg.appendChild(t);
  }
  archWrap.appendChild(svg);

  // Year dial overlay on arch
  const yw=document.createElement('div');
  yw.className='arch-year-wrap'+(w.locked?'':' interactive');
  const yd=document.createElement('div');
  yd.className='year-display'+(w.locked?' locked':'');
  yd.style.color=w.color;
  if(w.locked){
    yd.innerHTML=`<span class="yr-num">${w.currentYear} ✦</span>`;
  } else {
    yd.innerHTML=`
      <span class="yr-num" id="yr-${w.id}">${w.currentYear}</span>
      <input class="yr-slider" type="range"
        id="sl-${w.id}"
        min="1820" max="2030" value="${w.currentYear}"
        style="--c:${w.color}"
        oninput="previewY(event,${idx})"
        onchange="commitY(event,${idx})"
        onclick="event.stopPropagation()">`;
  }
  yw.appendChild(yd); archWrap.appendChild(yw);
  cell.appendChild(archWrap);

  // ── Thumbnail (no footer — thumb fills all remaining space) ──
  const thumb=document.createElement('div'); thumb.className='thumb-panel';
  thumb.style.borderColor=w.locked?w.color+'70':'rgba(200,168,75,0.18)';
  thumb.style.boxShadow=w.locked?`0 0 10px ${w.color}22`:'none';

  if(w.imgSrc){
    const wrap=document.createElement('div'); wrap.className='thumb-img-wrap';
    wrap.style.background=w.illustBg;
    wrap.innerHTML=`<img src="${w.imgSrc}" alt=""
      onerror="this.parentElement.innerHTML='<div class=\\'thumb-placeholder\\'><div class=\\'thumb-icon\\'>✦</div></div>'">
      <div class="thumb-img-label"></div>`;
    thumb.appendChild(wrap);
  } else {
    const ph=document.createElement('div'); ph.className='thumb-placeholder';
    ph.style.background=w.illustBg;
    ph.innerHTML=`<div class="thumb-icon">✦</div>`;
    thumb.appendChild(ph);
  }
  thumb.onclick=e=>{e.stopPropagation();openMem(w);};
  cell.appendChild(thumb);

  return cell;
}

// ═══════════════════════ YEAR SLIDER ═════════════════════════
// oninput: just update the number display while dragging
function previewY(e,idx){
  e.stopPropagation();
  const w=WS[idx]; if(w.locked)return;
  const val=parseInt(e.target.value);
  const el=document.getElementById('yr-'+w.id);
  if(el)el.textContent=val;
}
// onchange: fires on mouse/touch release — lock if correct
function commitY(e,idx){
  e.stopPropagation();
  const w=WS[idx]; if(w.locked)return;
  const val=parseInt(e.target.value);
  w.currentYear=val;
  if(val===w.correctYear){
    w.locked=true;
    showToast(`✦ ${w.correctYear} — memory fragment confirmed`);
    renderWindows();
  }
}

// ═══════════════════════ MEMORY FULLSCREEN ════════════════════
function openMem(w){
  const fi=document.getElementById('mem-fullimg');
  if(!w.imgSrc){
    fi.innerHTML=`<div class="mem-fullimg-ph"><span style="font-size:3rem;opacity:0.15">✦</span><span><em style="font-size:0.8em;opacity:0.6">Image not yet available</em></span></div>`;
  } else {
    fi.innerHTML=`<img src="${w.imgSrc}" style="width:100%;height:100%;object-fit:contain;"
      onerror="this.outerHTML='<div class=\\'mem-fullimg-ph\\'><span style=\\'font-size:3rem;opacity:0.15\\'>✦</span><span><em style=\\'font-size:0.8em;opacity:0.6\\'>Image could not be loaded</em></span></div>'">`;
  }
  document.getElementById('mem-overlay').classList.add('open');
}
function closeMem(){document.getElementById('mem-overlay').classList.remove('open');}
function bgClose(e){
  // Only close if clicking the overlay itself (not the image or close btn)
  if(e.target===document.getElementById('mem-overlay'))closeMem();
}

// ═══════════════════════ VIDEO FULLSCREEN ═════════════════════
// Accepts a bare video ID or any common YouTube URL form (watch?v=, youtu.be/, embed/, shorts/)
function extractYouTubeId(input){
  if(/^[\w-]{11}$/.test(input)) return input;
  const m=input.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : input;
}
function openVideo(ytIdOrUrl){
  const id=extractYouTubeId(ytIdOrUrl);
  const wrap=document.getElementById('vid-frame-wrap');
  wrap.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?rel=0"
    title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>`;
  document.getElementById('vid-overlay').classList.add('open');
}
function closeVideo(){
  document.getElementById('vid-overlay').classList.remove('open');
  document.getElementById('vid-frame-wrap').innerHTML=''; // stop playback
}
function bgCloseVideo(e){
  if(e.target===document.getElementById('vid-overlay'))closeVideo();
}

// ═══════════════════════ LEFT PAGE FULLSCREEN ═════════════════
function toggleFullscreen(){
  const pl=document.getElementById('page-l');
  const btn=document.getElementById('fs-toggle');
  const expanded=pl.classList.toggle('expanded');
  btn.textContent=expanded?'✕':'⛶';
  btn.title=expanded?'Exit fullscreen':'Expand to fullscreen';
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.getElementById('page-l').classList.contains('expanded')){
    toggleFullscreen();
  }
});

// ═══════════════════════ TOAST ════════════════════════════════
let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
